name: CPM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          concurrent_skipping: 'same_content_newer'

  build:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        compiler: [default]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: gcc
            cc: gcc
            cxx: g++
        exclude:
          - os: ubuntu-latest
            compiler: default

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure (with compiler override)
        if: matrix.cc != ''
        run: cmake --preset test -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Configure (default compiler)
        if: matrix.cc == ''
        run: cmake --preset test

      - name: Build
        run: cmake --build --preset test

      - name: Test
        run: ctest --preset test

  build-sanitizers:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sanitizer: [asan, ubsan]
        exclude:
          # UBSAN not supported on MSVC
          - os: windows-latest
            sanitizer: ubsan

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset test-${{ matrix.sanitizer }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRS_STD_BUILD_TESTS=ON -DRS_STD_BUILD_SHARED=ON -DRS_STD_BUILD_STATIC=ON -DRS_STD_ENABLE_ASAN=ON

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build --preset test-${{ matrix.sanitizer }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config RelWithDebInfo

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --preset test-${{ matrix.sanitizer }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%CD%\build\bin\RelWithDebInfo;%PATH%
          ctest --test-dir build --output-on-failure -C RelWithDebInfo

  build-fuzz:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config clang

      - name: Configure
        run: cmake --preset test-fuzz

      - name: Build
        run: cmake --build --preset test-fuzz

      - name: Fuzz Test
        run: ctest --preset test-fuzz

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/test-fuzz/**/crash-*
          retention-days: 30

  build-force-sqlite:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install \
            -DRS_STD_BUILD_TESTS=ON \
            -DRS_STD_BUILD_SHARED=ON \
            -DRS_STD_BUILD_STATIC=ON \
            -DRS_STD_FORCE_BUILD_SQLITE3=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install -DRS_STD_BUILD_TESTS=ON -DRS_STD_BUILD_SHARED=ON -DRS_STD_BUILD_STATIC=ON -DRS_STD_FORCE_BUILD_SQLITE3=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
